<!-- @dsCard group="Sections" height=440 width=1100 subtitle="Four square category tiles with label and arrow, under a section head" -->
<div class="ah-root">
  <section class="ah-section ah-section--end ah-category-grid" aria-labelledby="cat-heading">
    <div class="ah-container">
      <div class="ah-section-head">
        <div><h2 class="ah-heading ah-heading--section" id="cat-heading">Shop by category</h2></div>
        <a class="ah-link" href="#">View all products</a>
      </div>
      <ul class="ah-category-grid__list" role="list" id="cat-list"></ul>
    </div>
  </section>
</div>
<script>
  // Tiles share one placeholder image; each fills the square frame.
  const arrow = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>';
  const tiles = [['Handwash', 'var(--brand)'], ['Dishwash', 'var(--accent)'], ['Floor cleaner', 'var(--leaf)'], ['Refills', 'var(--leaf-tint)']];
  document.getElementById('cat-list').innerHTML = tiles.map(([label, fill]) => `
    <li>
      <a class="ah-category-grid__item" href="#">
        <span class="ah-category-grid__media">
          <svg viewBox="0 0 300 300" style="display: block; width: 100%; height: 100%;" role="img" aria-label="${label} placeholder image">
            <rect width="300" height="300" fill="var(--surface-200)"/>
            <rect x="130" y="50" width="40" height="26" rx="8" fill="var(--ink)"/>
            <rect x="105" y="74" width="90" height="180" rx="26" fill="var(--surface-100)"/>
            <rect x="120" y="130" width="60" height="70" rx="12" fill="${fill}"/>
          </svg>
        </span>
        <span class="ah-category-grid__label"><span>${label}</span>${arrow}</span>
      </a>
    </li>`).join('');
</script>
