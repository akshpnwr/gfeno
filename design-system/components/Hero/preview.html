<!-- @dsCard group="Sections" height=620 width=1100 subtitle="Home page hero: inset panel, label tag, display heading, two buttons, product image" -->
<div class="ah-root">
  <!-- In the theme the panel background comes from the section's colour scheme (scheme 2, surface-200). -->
  <section class="ah-hero" aria-labelledby="hero-heading">
    <div class="ah-container">
      <div class="ah-hero__panel" style="background: var(--surface-200);">
        <svg class="ah-hero__leaf" viewBox="0 0 100 100" aria-hidden="true" focusable="false"><path d="M10 90 C10 40 40 10 90 10 C90 60 60 90 10 90 Z"/></svg>
        <div class="ah-hero__content">
          <span class="ah-tag ah-tag--label ah-hero__tag">Made with natural ingredients</span>
          <h1 class="ah-heading ah-hero__heading" id="hero-heading">Plant-powered clean for every corner of your home.</h1>
          <p class="ah-body ah-hero__text">Handwash, dishwash and floor cleaners made with neem, tulsi, aloe vera and citrus. Every ingredient is on the label.</p>
          <div class="ah-hero__actions">
            <a class="ah-btn ah-btn--primary" href="#">Shop handwash</a>
            <a class="ah-btn ah-btn--outline" href="#">Shop all products</a>
          </div>
        </div>
        <div class="ah-hero__media" role="img" aria-label="Product image placeholder: handwash bottle with neem leaves">
          <svg viewBox="0 0 400 340" preserveAspectRatio="xMidYMid slice" style="display: block; width: 100%; height: 100%;" aria-hidden="true">
            <rect width="400" height="340" fill="var(--surface-100)"/>
            <path d="M30,320 A240 240 0 0 1 270,80 A240 240 0 0 1 30,320 Z" fill="var(--leaf-tint)"/>
            <path d="M280,130 A80 80 0 0 1 360,50 A80 80 0 0 1 280,130 Z" fill="var(--leaf)"/>
            <rect x="180" y="62" width="40" height="28" rx="8" fill="var(--ink)"/>
            <rect x="150" y="88" width="100" height="220" rx="28" fill="var(--surface-200)"/>
            <rect x="165" y="160" width="70" height="80" rx="12" fill="var(--brand)"/>
          </svg>
        </div>
      </div>
    </div>
  </section>
</div>
