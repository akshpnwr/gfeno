<!-- @dsCard group="Sections" height=380 width=1100 subtitle="Intro beside a leaf-tint 'We say' card and a hairline 'We won't say' card" -->
<div class="ah-root">
  <section class="ah-section ah-section--end ah-promise" aria-labelledby="promise-heading">
    <div class="ah-container">
      <div class="ah-promise__grid">
        <div class="ah-promise__intro">
          <p class="ah-eyebrow">Eyebrow</p>
          <h2 class="ah-heading ah-heading--section" id="promise-heading">Section heading</h2>
          <p class="ah-body">One or two sentences of sample copy that introduce the two lists.</p>
        </div>
        <div class="ah-promise__cards">
          <div class="ah-promise__card ah-promise__card--say">
            <h3 class="ah-promise__title">We say</h3>
            <ul class="ah-promise__list" role="list">
              <li class="ah-promise__item"><svg class="ah-promise__icon ah-promise__icon--say" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 6 9 17l-5-5"/></svg><span>Made with natural ingredients</span></li>
              <li class="ah-promise__item"><svg class="ah-promise__icon ah-promise__icon--say" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 6 9 17l-5-5"/></svg><span>A claim you can prove</span></li>
            </ul>
          </div>
          <div class="ah-promise__card ah-promise__card--wont-say">
            <h3 class="ah-promise__title">We won't say</h3>
            <ul class="ah-promise__list" role="list">
              <li class="ah-promise__item"><svg class="ah-promise__icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg><span>"Chemical-free"</span></li>
              <li class="ah-promise__item"><svg class="ah-promise__icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg><span>"100% natural", unless the formula supports it</span></li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>
