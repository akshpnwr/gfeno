<!-- @dsCard group="Commerce" height=560 width=1100 subtitle="Product cards in a grid: bestseller, sale, choose options and sold out states" -->
<style>
  /* Dawn provides .visually-hidden in the theme. */
  .visually-hidden { position: absolute !important; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); border: 0; white-space: nowrap; }
</style>
<div class="ah-root">
  <section class="ah-section ah-section--end ah-featured-products" aria-labelledby="fp-heading">
    <div class="ah-container">
      <div class="ah-section-head">
        <div><h2 class="ah-heading ah-heading--section" id="fp-heading">Bestsellers</h2></div>
        <a class="ah-link" href="#">Shop bestsellers</a>
      </div>
      <ul class="ah-featured-products__grid" role="list" id="fp-grid"></ul>
    </div>
  </section>
</div>
<script>
  // Sample products and prices, for the card states only.
  const star = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"/></svg>';
  const stars = (r) => `<span class="ah-stars" role="img" aria-label="${r} out of 5 stars" style="--ah-star-size: 14px;">` +
    `<span class="ah-stars__row ah-stars__row--empty">${star.repeat(5)}</span>` +
    `<span class="ah-stars__row ah-stars__row--fill" style="width: ${(r / 5) * 100}%;">${star.repeat(5)}</span></span>`;
  const products = [
    { title: 'Neem & Tulsi Handwash, 250 ml', meta: 'Neem, tulsi, aloe vera', rating: 4.8, count: 126, price: '₹199', badge: 'Bestseller', fill: 'var(--brand)', action: 'add' },
    { title: 'Lemon & Reetha Dishwash, 500 ml', meta: 'Lemon, reetha', rating: 4.6, count: 84, price: '₹169', compare: '₹199', badge: '15% off', offer: true, fill: 'var(--accent)', action: 'add' },
    { title: 'Lemongrass Floor Cleaner', meta: 'Lemongrass, neem', rating: 4.5, count: 52, price: 'From ₹229', badge: 'New', fill: 'var(--leaf)', action: 'options' },
    { title: 'Aloe Vera Handwash Refill, 750 ml', meta: 'Aloe vera, neem', rating: 4.7, count: 61, price: '₹349', fill: 'var(--leaf-tint)', action: 'soldout' },
  ];
  const action = { add: '<button type="button" class="ah-btn ah-btn--primary ah-btn--full">Add to cart</button>',
    options: '<a class="ah-btn ah-btn--primary ah-btn--full" href="#">Choose options</a>',
    soldout: '<button type="button" class="ah-btn ah-btn--primary ah-btn--full" disabled>Sold out</button>' };
  document.getElementById('fp-grid').innerHTML = products.map((p) => `
    <li>
      <article class="ah-card">
        <div class="ah-card__media">
          <a href="#" tabindex="-1" aria-hidden="true">
            <svg viewBox="0 0 300 300" style="display: block; width: 100%; height: 100%;" aria-hidden="true">
              <rect width="300" height="300" fill="var(--surface-200)"/>
              <rect x="130" y="50" width="40" height="26" rx="8" fill="var(--ink)"/>
              <rect x="105" y="74" width="90" height="180" rx="26" fill="var(--surface-100)"/>
              <rect x="120" y="130" width="60" height="70" rx="12" fill="${p.fill}"/>
            </svg>
          </a>
          ${p.badge ? `<span class="ah-card__badge${p.offer ? ' ah-card__badge--offer' : ''}">${p.badge}</span>` : ''}
        </div>
        <div class="ah-card__body">
          <h3 class="ah-card__title"><a href="#">${p.title}</a></h3>
          <p class="ah-card__meta">${p.meta}</p>
          <div class="ah-card__rating">${stars(p.rating)}<span aria-hidden="true">${p.rating}</span><span>(${p.count}<span class="visually-hidden"> total reviews</span>)</span></div>
          ${p.compare
            ? `<p class="ah-price ah-price--sale"><span class="visually-hidden">Sale price</span><span class="ah-price__current">${p.price}</span><span class="visually-hidden">Regular price</span><s class="ah-price__compare">${p.compare}</s></p>`
            : `<p class="ah-price"><span class="ah-price__current">${p.price}</span></p>`}
          <div class="ah-card__actions">${action[p.action]}</div>
        </div>
      </article>
    </li>`).join('');
</script>
